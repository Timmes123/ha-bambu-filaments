name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Settings → System → Logs. Remove tokens or personal data before pasting.
      render: text
